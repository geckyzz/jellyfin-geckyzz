name: Release plugin

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build Jellyfin Plugin
        uses: oddstr13/jellyfin-plugin-repository-manager@v1.1.1
        id: jprm
        with:
          path: "."
          dotnet-target: "net10.0"
          dotnet-config: "Release"
          max-cpu-count: "1"
          verbosity: "debug"

      - name: Get tag and version
        id: vars
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.vars.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --title "${{ steps.vars.outputs.tag }}" \
            --notes "Release ${{ steps.vars.outputs.tag }}" \
            --draft=false --prerelease=false

      - name: Upload Release Asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.vars.outputs.tag }}" \
            "${{ steps.jprm.outputs.artifact }}" \
            --repo "${{ github.repository }}"

      - name: Update manifest.json
        env:
          TAG: ${{ steps.vars.outputs.tag }}
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          ARTIFACT="${{ steps.jprm.outputs.artifact }}"
          FILENAME=$(basename "$ARTIFACT")
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${FILENAME}"
          export TAG VERSION DOWNLOAD_URL
          python3 .github/scripts/update_manifest.py

      - name: Append targetAbi to manifest
        run: |
          python3 .github/scripts/append_target_abi.py

      - name: Commit and push manifest
        run: |
          git config user.name "geckyzz"
          git config user.email "gecko.geckyzz@proton.me"
          git checkout main
          git add manifest.json
          git commit -m "Add version ${{ steps.vars.outputs.tag }} to manifest ($(date -u +%Y-%m-%dT%H:%M:%SZ))" || echo "nothing to commit"
          git push origin main
