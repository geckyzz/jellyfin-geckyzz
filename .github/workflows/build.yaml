name: Build plugin

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md"]
  pull_request:
    branches: [main]
    paths-ignore: ["**/*.md"]
  workflow_dispatch:

jobs:
  build:
    uses: jellyfin/jellyfin-meta-plugins/.github/workflows/build.yaml@master
    with:
      dotnet-version: "10.0.x"
      dotnet-target: "net10.0"

  append-target-abi:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Append targetAbi to manifest
        run: python3 .github/scripts/append_target_abi.py
      - name: Commit manifest if changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
          else
            git config user.name "geckyzz"
            git config user.email "gecko.geckyzz@proton.me"
            git add manifest.json
            git commit -m "chore: append targetAbi to manifest"
            git push origin main
          fi
